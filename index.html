<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description" content="一个使用 Vite 和 React 构建的 GitHub Pages 部署练习页面" />
  <meta name="theme-color" content="#111827" />

  <title>GitHub Pages 部署练习</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: #f3f4f6;
      color: #111827;
      font-family:
        Inter, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
    }

    #root {
      min-height: 100vh;
    }

    .loading {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 24px;
      text-align: center;
    }

    .loading-card {
      width: min(100%, 420px);
      padding: 32px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 10px 30px rgb(17 24 39 / 8%);
    }

    .loading-title {
      margin: 0 0 12px;
      font-size: 24px;
      font-weight: 700;
    }

    .loading-text {
      margin: 0;
      color: #6b7280;
      font-size: 14px;
      line-height: 1.7;
    }

    @media (max-width: 480px) {
      .loading-card {
        padding: 24px 20px;
      }

      .loading-title {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>
  <div id="root">
    <div class="loading">
      <div class="loading-card">
        <h1 class="loading-title">正在加载页面</h1>
        <p class="loading-text">
          如果你看到这段文字，说明 React 还没有完成初始化。
        </p>
      </div>
    </div>
  </div>

  <noscript>
    <div class="loading">
      <div class="loading-card">
        <h1 class="loading-title">需要启用 JavaScript</h1>
        <p class="loading-text">当前页面需要 JavaScript 才能正常运行。</p>
      </div>
    </div>
  </noscript>

  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
